name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  test:
    runs-on: arc-runner-praetor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Run unit and integration tests
        run: pytest tests/unit tests/integration -v

  llm-regression:
    if: github.event_name != 'pull_request'
    needs: [test]
    runs-on: arc-runner-praetor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install httpx pytest
      - name: Run LLM tool-calling regression tests
        env:
          SMOKE_TESTS: "1"
        run: pytest tests/smoke/test_llm_tool_calling.py -v

  set-tag:
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-praetor
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  detect-changes:
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-praetor
    outputs:
      rebuild: ${{ steps.detect.outputs.rebuild }}
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: detect
        run: |
          ALL_COMPONENTS=(coder research pipeline webhook qa reviewer benchmark)

          # workflow_dispatch always rebuilds everything
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REBUILD=("${ALL_COMPONENTS[@]}")
            echo "Manual dispatch — rebuilding all components"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
            echo "Changed files:"
            echo "$CHANGED"

            REBUILD=()

            # Shared files force full rebuild
            if echo "$CHANGED" | grep -qE '^(requirements\.txt|common/)'; then
              REBUILD=("${ALL_COMPONENTS[@]}")
            else
              echo "$CHANGED" | grep -qE '^(agents/coder/|Dockerfile\.coder-worker)' && REBUILD+=(coder)
              echo "$CHANGED" | grep -qE '^(agents/research/|Dockerfile\.research-worker)' && REBUILD+=(research)
              echo "$CHANGED" | grep -qE '^(pipelines/|Dockerfile\.pipeline-worker)' && REBUILD+=(pipeline)
              echo "$CHANGED" | grep -qE '^(webhooks/|Dockerfile\.webhook-adapter)' && REBUILD+=(webhook)
              echo "$CHANGED" | grep -qE '^(agents/qa/|Dockerfile\.qa-worker)' && REBUILD+=(qa)
              echo "$CHANGED" | grep -qE '^(agents/pr_reviewer/|Dockerfile\.reviewer-worker)' && REBUILD+=(reviewer)
              echo "$CHANGED" | grep -qE '^(agents/benchmark/|Dockerfile\.benchmark-worker)' && REBUILD+=(benchmark)
            fi

            # build.yaml change forces full rebuild
            if echo "$CHANGED" | grep -qE '\.github/workflows/build\.yaml'; then
              REBUILD=("${ALL_COMPONENTS[@]}")
            fi
          fi

          JSON=$(python3 -c "import sys,json; print(json.dumps(sys.argv[1:]))" "${REBUILD[@]}")
          echo "rebuild=$JSON" >> "$GITHUB_OUTPUT"

          # Full matrix JSON for build-amd64 — only include components to rebuild
          MATRIX=$(python3 -c "
          import sys,json
          c=json.loads(sys.argv[1])
          M={'coder':{'component':'coder','image':'amerenda/praetor-coder','dockerfile':'Dockerfile.coder-worker'},'pipeline':{'component':'pipeline','image':'amerenda/praetor-pipeline','dockerfile':'Dockerfile.pipeline-worker'},'research':{'component':'research','image':'amerenda/praetor-research','dockerfile':'Dockerfile.research-worker'},'webhook':{'component':'webhook','image':'amerenda/praetor-webhook','dockerfile':'Dockerfile.webhook-adapter'},'qa':{'component':'qa','image':'amerenda/praetor-qa','dockerfile':'Dockerfile.qa-worker'},'reviewer':{'component':'reviewer','image':'amerenda/praetor-reviewer','dockerfile':'Dockerfile.reviewer-worker'},'benchmark':{'component':'benchmark','image':'amerenda/praetor-benchmark','dockerfile':'Dockerfile.benchmark-worker'}}
          print(json.dumps({'include':[M[x] for x in c if x in M]}))
          " "$JSON")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Components to rebuild: $JSON"

  build-amd64:
    needs: [detect-changes, set-tag, test]
    if: "github.event_name != 'pull_request' && needs.detect-changes.outputs.rebuild != '[]'"
    runs-on: arc-runner-praetor
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push ${{ matrix.component }} (amd64)
        run: |
          docker build \
            -t "${{ matrix.image }}:${{ needs.set-tag.outputs.tag }}-amd64" \
            -f ${{ matrix.dockerfile }} \
            .
          docker push "${{ matrix.image }}:${{ needs.set-tag.outputs.tag }}-amd64"

  build-arm64:
    needs: [detect-changes, set-tag, test]
    if: "github.event_name != 'pull_request' && needs.detect-changes.outputs.rebuild != '[]'"
    runs-on: [self-hosted, mac-mini]
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Free disk space (dangling images only)
        run: docker image prune -f

      - name: Build and push changed images (arm64)
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          REBUILD: ${{ needs.detect-changes.outputs.rebuild }}
        run: |
          for entry in \
            "coder:Dockerfile.coder-worker:amerenda/praetor-coder" \
            "pipeline:Dockerfile.pipeline-worker:amerenda/praetor-pipeline" \
            "research:Dockerfile.research-worker:amerenda/praetor-research" \
            "webhook:Dockerfile.webhook-adapter:amerenda/praetor-webhook" \
            "qa:Dockerfile.qa-worker:amerenda/praetor-qa" \
            "reviewer:Dockerfile.reviewer-worker:amerenda/praetor-reviewer" \
            "benchmark:Dockerfile.benchmark-worker:amerenda/praetor-benchmark"; do
            COMPONENT=$(echo "$entry" | cut -d: -f1)
            DOCKERFILE=$(echo "$entry" | cut -d: -f2)
            IMAGE=$(echo "$entry" | cut -d: -f3)

            if ! python3 -c "import sys,json; c=json.loads(sys.argv[1]); sys.exit(0 if sys.argv[2] in c else 1)" "$REBUILD" "$COMPONENT"; then
              echo "Skipping $COMPONENT (not changed)"
              continue
            fi

            echo "Building $COMPONENT arm64..."
            docker build -t "${IMAGE}:${TAG}-arm64" -f "${DOCKERFILE}" .
            docker push "${IMAGE}:${TAG}-arm64"
            docker rmi "${IMAGE}:${TAG}-arm64" || true
          done

  manifest:
    needs: [detect-changes, set-tag, build-amd64, build-arm64]
    if: "github.event_name != 'pull_request' && needs.detect-changes.outputs.rebuild != '[]'"
    runs-on: arc-runner-praetor
    steps:
      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Create multi-arch manifests for rebuilt components
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          REBUILD: ${{ needs.detect-changes.outputs.rebuild }}
        run: |
          for IMAGE in praetor-coder praetor-pipeline praetor-research praetor-webhook praetor-qa praetor-reviewer praetor-benchmark; do
            COMPONENT=$(echo "$IMAGE" | sed 's/praetor-//')

            if ! python3 -c "import sys,json; c=json.loads(sys.argv[1]); sys.exit(0 if sys.argv[2] in c else 1)" "$REBUILD" "$COMPONENT"; then
              echo "Skipping manifest for $COMPONENT (not rebuilt)"
              continue
            fi

            docker buildx imagetools create -t "amerenda/${IMAGE}:${TAG}" \
              "amerenda/${IMAGE}:${TAG}-amd64" \
              "amerenda/${IMAGE}:${TAG}-arm64"
            docker buildx imagetools create -t "amerenda/${IMAGE}:latest" \
              "amerenda/${IMAGE}:${TAG}-amd64" \
              "amerenda/${IMAGE}:${TAG}-arm64"
          done

  deploy:
    needs: [detect-changes, set-tag, manifest]
    if: "github.event_name != 'pull_request' && needs.detect-changes.outputs.rebuild != '[]'"
    runs-on: arc-runner-praetor
    steps:
      - uses: actions/checkout@v6

      - name: Export app credentials from runner env
        run: |
          echo "CODER_APP_ID=$CODER_APP_ID" >> "$GITHUB_ENV"
          {
            echo 'CODER_APP_PRIVATE_KEY<<PKEOF'
            echo "$CODER_APP_PRIVATE_KEY"
            echo 'PKEOF'
          } >> "$GITHUB_ENV"

      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ env.CODER_APP_ID }}
          private-key: ${{ env.CODER_APP_PRIVATE_KEY }}
          repositories: k3s-dean-gitops

      - name: Create deploy PR in k3s-dean-gitops
        env:
          TAG: ${{ needs.set-tag.outputs.tag }}
          REBUILD: ${{ needs.detect-changes.outputs.rebuild }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          rm -rf /tmp/gitops
          git clone https://x-access-token:${APP_TOKEN}@github.com/${GITOPS_REPO}.git /tmp/gitops
          cd /tmp/gitops

          # Close any existing praetor deploy PRs to avoid stale branches
          EXISTING_PRS=$(curl -s \
            -H "Authorization: token ${APP_TOKEN}" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls?state=open&per_page=100" \
            | python3 -c "
          import json,sys
          for pr in json.load(sys.stdin):
              ref = pr.get('head',{}).get('ref','')
              if ref.startswith('deploy/praetor-'):
                  print(pr['number'])
          " 2>/dev/null || true)
          for PR_NUM in $EXISTING_PRS; do
            echo "Closing superseded PR #${PR_NUM}"
            curl -s -X PATCH \
              -H "Authorization: token ${APP_TOKEN}" \
              "https://api.github.com/repos/${GITOPS_REPO}/pulls/${PR_NUM}" \
              -d '{"state":"closed"}' > /dev/null
          done

          BRANCH="deploy/praetor-${TAG}"
          git checkout -b "${BRANCH}"

          # Update image tags only for rebuilt components
          for entry in \
            "coder|amerenda/praetor-coder|apps/praetor/coder-worker/deployment.yaml" \
            "pipeline|amerenda/praetor-pipeline|apps/praetor/pipeline-worker/deployment.yaml" \
            "research|amerenda/praetor-research|apps/praetor/research-worker/deployment.yaml" \
            "webhook|amerenda/praetor-webhook|apps/praetor/webhook-adapter/deployment.yaml" \
            "qa|amerenda/praetor-qa|apps/praetor/qa-worker/deployment.yaml" \
            "reviewer|amerenda/praetor-reviewer|apps/praetor/reviewer-worker/deployment.yaml" \
            "benchmark|amerenda/praetor-benchmark|apps/praetor/benchmark-worker/deployment.yaml"; do
            COMPONENT=$(echo "$entry" | cut -d'|' -f1)
            IMAGE=$(echo "$entry" | cut -d'|' -f2)
            MANIFEST=$(echo "$entry" | cut -d'|' -f3)
            if python3 -c "import sys,json; c=json.loads(sys.argv[1]); sys.exit(0 if sys.argv[2] in c else 1)" "$REBUILD" "$COMPONENT"; then
              sed -i "s|image: ${IMAGE}:[^ ]*|image: ${IMAGE}:${TAG}|g" "${MANIFEST}"
              echo "Updated ${COMPONENT} → ${TAG}"
            fi
          done

          git config user.name "praetor-coder[bot]"
          git config user.email "praetor-coder[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No manifest changes — skipping PR"; exit 0; }
          git commit -m "deploy: praetor ${TAG}"
          git push origin "${BRANCH}"

          COMMIT_MSG=$(git -C "${GITHUB_WORKSPACE}" log -1 --format='%s' 2>/dev/null || echo "")
          NL=$'\n'
          PR_BODY="**praetor ${TAG}**${NL}${NL}${COMMIT_MSG}${NL}${NL}Source: https://github.com/amerenda/praetor/commit/${GITHUB_SHA}"

          PR_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${APP_TOKEN}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${GITOPS_REPO}/pulls" \
            -d "$(jq -n \
              --arg title "deploy: praetor ${TAG}" \
              --arg body "${PR_BODY}" \
              --arg head "${BRANCH}" \
              --arg base "main" \
              '{title: $title, body: $body, head: $head, base: $base}')")

          PR_NUMBER=$(echo "$PR_RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['number'])")
          curl -s -X POST \
            -H "Authorization: token ${APP_TOKEN}" \
            "https://api.github.com/repos/${GITOPS_REPO}/issues/${PR_NUMBER}/assignees" \
            -d '{"assignees":["amerenda"]}'
          echo "Deploy PR #${PR_NUMBER} created: deploy/praetor-${TAG}"

  notify-failure:
    if: failure()
    needs: [build-amd64, build-arm64, manifest, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue for build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI failed: ${{ github.workflow }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure" || echo "Could not create issue"
