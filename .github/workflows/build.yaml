name: Build and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GITOPS_REPO: amerenda/k3s-dean-gitops

jobs:
  set-tag:
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-praetor
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-amd64:
    needs: [set-tag]
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-praetor
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: coder
            image: amerenda/praetor-coder
            dockerfile: Dockerfile.coder-worker
          - component: pipeline
            image: amerenda/praetor-pipeline
            dockerfile: Dockerfile.pipeline-worker
          - component: research
            image: amerenda/praetor-research
            dockerfile: Dockerfile.research-worker
          - component: webhook
            image: amerenda/praetor-webhook
            dockerfile: Dockerfile.webhook-adapter
          - component: qa
            image: amerenda/praetor-qa
            dockerfile: Dockerfile.qa-worker
          - component: reviewer
            image: amerenda/praetor-reviewer
            dockerfile: Dockerfile.reviewer-worker
    steps:
      - uses: actions/checkout@v6

      - name: Login to Docker Hub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push ${{ matrix.component }}
        run: |
          docker build \
            -t "${{ matrix.image }}:${{ needs.set-tag.outputs.tag }}" \
            -t "${{ matrix.image }}:latest" \
            -f ${{ matrix.dockerfile }} \
            .
          docker push "${{ matrix.image }}:${{ needs.set-tag.outputs.tag }}"
          docker push "${{ matrix.image }}:latest"

  notify-failure:
    if: failure()
    needs: [build-amd64]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Issue for build failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "CI failed: ${{ github.workflow }}" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "ci-failure" || echo "Could not create issue"
